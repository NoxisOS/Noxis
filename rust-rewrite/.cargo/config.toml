[target.x86_64-unknown-none]
rustflags = [
    "-C", "code-model=kernel",
    "-C", "target-feature=-sse,-sse2,-sse3,-ssse3,-sse4.1,-sse4.2,-avx,-avx2",
    "-C", "relocation-model=static",
]

[alias]
kbuild = "build --package kernel --target x86_64-unknown-none -Z build-std=core,compiler_builtins,alloc -Z build-std-features=compiler-builtins-mem"
xtask  = "run --package xtask --"
